<body>
  <a class="skip-link" href="#chapter-library">Skip to the books</a>
  <div class="room-light" aria-hidden="true"></div>
  <header class="library-heading">
    <nav class="room-navigation" aria-label="Explore">
      <a id="library-home" href="../?lang=ru"><span aria-hidden="true">←</span> <span id="home-label">Домой</span></a>
      <a id="library-atlas" href="atlas-webgpu.html?lang=ru"><span id="atlas-label">Карта леса</span> <span aria-hidden="true">↗</span></a>
    </nav>
    <div class="heading-line">
      <div><p id="library-eyebrow">В гостях у Пин-Пина</p><h1 id="library-title">Наша библиотека</h1></div>
      <div class="language-selector" role="group" aria-label="Language">
        <button type="button" data-lang="ru" lang="ru" title="Русский" aria-label="Русский" aria-pressed="true"></button>
        <button type="button" data-lang="en" lang="en" title="English" aria-label="English" aria-pressed="false"></button>
        <button type="button" data-lang="es" lang="es" title="Español" aria-label="Español" aria-pressed="false"></button>
      </div>
    </div>
    <p id="library-intro">Выберите книжку, чтобы скачать её и читать вместе.</p>
  </header>
  <main class="library-main">
    <div class="library-tools">
      <label class="search"><span id="search-label" class="visually-hidden">Найти книжку</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="chapter-search" type="search" aria-labelledby="search-label" placeholder="Найти книжку" autocomplete="off"></label>
      <p id="library-count"></p>
    </div>
    <div class="download-tray" id="download-tray" hidden>
      <p id="download-status" role="status" aria-live="polite"></p>
      <progress id="download-progress" max="100" aria-label="Download progress"></progress>
      <button type="button" id="cancel-download">Отменить</button>
    </div>
    <p id="library-status" role="status" aria-live="polite">Загружаем библиотеку…</p>
    <div id="chapter-library" class="bookcase" tabindex="-1" aria-busy="true"></div>
    <button id="retry-library" class="retry-library" type="button" hidden>Попробовать ещё раз</button>
  </main>
  <footer class="library-footer"><p id="library-note">Книжки для семейного чтения · PDF</p><a id="original-book" href="../original/">Оригинальная книга</a><a id="permissions-link" href="../permissions/index.html">Правила использования</a></footer>
