<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rabbit and PinPin walk home · R19 preview</title><style>body{margin:0;padding:24px;background:#f8f3e8;color:#30291e;font:18px system-ui}main{max-width:1600px;margin:auto}nav{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}button,a{font:inherit;color:inherit}button{background:#fff;border:1px solid #ad9470;border-radius:24px;padding:8px 14px;cursor:pointer}img{width:100%;height:auto;border-radius:12px}p{line-height:1.5}a{display:inline-block;margin:8px 0}</style><main><h1 id="title"></h1><nav><button data-lang="ru">🇷🇺</button><button data-lang="en">🇬🇧</button><button data-lang="es">🇪🇸</button></nav><p id="note"></p><a id="full" target="_blank"><img id="board" width="2640" height="670"></a><p><a id="reader"></a></p><div id="captions"></div></main><script>
const labels={ru:['Домой вместе','Пять новых кадров для просмотра. Нажмите на лист, чтобы рассмотреть крупнее. Опубликованная глава пока не менялась.','Открыть главу с новыми кадрами'],en:['Walking home together','Five new proposed scenes. Click the sheet to zoom. The published chapter is unchanged.','Read the chapter with the new scenes'],es:['Juntos de vuelta a casa','Cinco escenas nuevas propuestas. Pulsa la hoja para ampliar. El capítulo publicado sigue igual.','Leer el capítulo con las nuevas escenas']};let lang=new URLSearchParams(location.search).get('lang')||'ru';if(!labels[lang])lang='ru';let rows;function render(){document.documentElement.lang=lang;title.textContent=labels[lang][0];note.textContent=labels[lang][1];board.src='return-home-'+lang+'.webp';full.href=board.src;reader.href='/storyboard/review/bath-magic-r19.html?lang='+lang+'#scene-05c1';reader.textContent=labels[lang][2];captions.replaceChildren();for(const [i,r]of rows.entries()){const p=document.createElement('p');p.textContent=(i+1)+'. '+r.captions[lang].join(' ');captions.append(p)}}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});fetch('../plan/return-home-inserts.json').then(r=>r.json()).then(d=>{rows=d.rows;render()});</script></html>
