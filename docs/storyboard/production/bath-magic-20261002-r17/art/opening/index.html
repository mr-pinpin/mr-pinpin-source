<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R17 opening — working gallery</title><style>body{font:16px/1.5 system-ui;background:#f7eedb;color:#322719;margin:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}article{background:#fffaf0;padding:12px;border-radius:12px}img{width:100%;height:auto}p{margin:.5em 0}small{color:#665a46}a{color:#7b4923}</style><h1>The morning before the bath</h1><p>R17 working illustrations. Existing published chapter is unchanged. <a href="story-plan.json">Story plan and captions</a> · <a href="selection.json">Selected art and provenance</a></p><main id="cards"></main><script>Promise.all([fetch('selection.json').then(r=>r.json()),fetch('story-plan.json').then(r=>r.json())]).then(([sel,plan])=>{for(const s of plan.scenes){const a=sel.selected[s.id];if(!a)continue;const el=document.createElement('article');const h=document.createElement('h2');h.textContent=s.number+' · '+s.id;el.append(h);const link=document.createElement('a');link.href='masters/'+a.master.split('/').pop();const im=document.createElement('img');im.src='web/'+a.web.split('/').pop();im.alt=s.paragraphs.en.join(' ');link.append(im);el.append(link);for(const l of ['ru','en']){const p=document.createElement('p');p.lang=l;p.textContent=s.paragraphs[l].join(' ');el.append(p)}const note=document.createElement('small');note.textContent=a.reviewStatus;el.append(note);document.querySelector('main').append(el)}})</script></html>
