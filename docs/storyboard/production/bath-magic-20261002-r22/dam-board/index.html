<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beaver dam · R22 storyboard</title><style>body{margin:0;padding:24px;background:#f8f3e8;color:#30291e;font:18px system-ui}main{max-width:1700px;margin:auto}nav{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}button,a{font:inherit;color:inherit}button{background:#fff;border:1px solid #ad9470;border-radius:24px;padding:8px 14px;cursor:pointer}img{display:block;width:100%;height:auto;border-radius:12px}p{line-height:1.5}a{display:inline-block;margin:8px 0}figure{margin:24px 0}figcaption,summary{margin:12px 0}details{margin:20px 0}h1{font-size:1.6em}</style><main><h1 id="title"></h1><nav><button data-lang="ru">🇷🇺</button><button data-lang="en">🇬🇧</button><button data-lang="es">🇪🇸</button></nav><p id="status"></p><p><a id="reader"></a></p><section id="sheets"></section></main><script>
const $=id=>document.getElementById(id);const strings={ru:['У бобровой плотины','Открыть эти кадры внутри полной главы','Готовые предложения','Переходы: два прежних кадра до и после','Полосы по пять кадров','Новые иллюстрации ещё создаются; здесь показаны только готовые группы.','Все20 новых кадров включены в главу из191сцены. Это предложение для просмотра.'],en:['At the beaver dam','Open these scenes inside the full chapter','Ready proposals','Transitions: two retained scenes before and after','Five-frame strips','New illustrations are still in production; only completed groups appear here.','All20 new scenes are inside the191-scene chapter. This is a proposal for review.'],es:['En la presa de los castores','Abrir estas escenas dentro del capítulo completo','Propuestas listas','Transiciones: dos escenas previas antes y después','Tiras de cinco viñetas','Las ilustraciones siguen en producción; aquí solo aparecen los grupos terminados.','Las20 escenas nuevas están dentro del capítulo de191escenas. Es una propuesta para revisar.']};
let lang=new URLSearchParams(location.search).get('lang')||'ru';if(!strings[lang])lang='ru';let manifest;
function figure(row){const f=document.createElement('figure'),c=document.createElement('figcaption'),a=document.createElement('a'),i=document.createElement('img');c.textContent=row.panels.map(p=>p.id.replace('scene-','')).join(' · ');a.href=row.path+'?v='+row.sha256.slice(0,12);a.target='_blank';i.src=a.href;i.width=row.width;i.height=row.height;i.loading='lazy';i.alt=c.textContent;a.append(i);f.append(c,a);return f}
function render(){const t=strings[lang];document.documentElement.lang=lang;$('title').textContent=t[0];$('reader').textContent=t[1];$('reader').href='/storyboard/review/bath-magic-r22.html?lang='+lang+'#scene-320';$('status').textContent=t[2]+': '+manifest.selectedFrames+'/20. '+t[manifest.selectedFrames===20?6:5];$('sheets').replaceChildren();const rows=manifest.sheets.filter(r=>r.lang===lang),full=rows.find(r=>r.kind==='twenty-frame');if(full){$('sheets').append(figure(full));for(const [kind,label]of[['transitions',t[3]],['five-frame',t[4]]]){const d=document.createElement('details'),s=document.createElement('summary');s.textContent=label;d.append(s);rows.filter(r=>r.kind===kind).forEach(r=>d.append(figure(r)));$('sheets').append(d)}}else rows.forEach(r=>$('sheets').append(figure(r)));}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});fetch('manifest.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{manifest=d;render()}).catch(e=>{$('status').textContent=e.message});
</script></html>
