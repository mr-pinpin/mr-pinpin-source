<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Willow gag · R23 storyboard</title><style>body{margin:0;padding:24px;background:#f8f3e8;color:#30291e;font:18px system-ui}main{max-width:1700px;margin:auto}nav{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}button,a{font:inherit;color:inherit}button{background:#fff;border:1px solid #ad9470;border-radius:24px;padding:8px 14px;cursor:pointer}img{display:block;width:100%;height:auto;border-radius:12px}p{line-height:1.5}a{display:inline-block;margin:8px 0}figure{margin:24px 0}figcaption,summary{margin:12px 0}details{margin:20px 0}h1{font-size:1.6em}</style><main><h1 id="title"></h1><nav><button data-lang="ru">🇷🇺</button><button data-lang="en">🇬🇧</button><button data-lang="es">🇪🇸</button></nav><p id="tempo"></p><p id="status"></p><p><a id="reader"></a></p><section id="sheets"></section></main><script>
const $=id=>document.getElementById(id),text={
ru:['Ива, ветки и очень большое дерево','Повтор 1 → повтор 2 → повтор 3 → пауза → рост → удивление','Открыть полную главу с первого кадра шутки','Готово кадров','Иллюстрации ещё создаются; показаны только готовые полосы.','Все 15 кадров находятся в главе из 205 сцен. Предложение для просмотра.','Вся шутка на одном листе','Переходы до и после'],
en:['The willow, the branches and a very big tree','Repetition 1 → repetition 2 → repetition 3 → pause → growth → reaction','Open the full chapter at the start of the gag','Frames ready','Illustrations are still in production; only completed strips are shown.','All 15 frames are inside the 205-scene chapter. A proposal for review.','The complete gag on one sheet','Before and after transitions'],
es:['El sauce, las ramas y un árbol muy grande','Repetición 1 → repetición 2 → repetición 3 → pausa → crecimiento → reacción','Abrir el capítulo completo al inicio de la broma','Viñetas listas','Las ilustraciones siguen en producción; solo se muestran tiras completas.','Las 15 viñetas están dentro del capítulo de 205 escenas. Propuesta para revisar.','Toda la broma en una hoja','Transiciones anteriores y posteriores']};
let lang=new URLSearchParams(location.search).get('lang')||'ru';if(!text[lang])lang='ru';let manifest;
function figure(row){const f=document.createElement('figure'),c=document.createElement('figcaption'),a=document.createElement('a'),i=document.createElement('img');c.textContent=row.panels.map(p=>p.id.replace('scene-','')).join(' · ');a.href=row.path+'?v='+row.sha256.slice(0,12);a.target='_blank';i.src=a.href;i.width=row.width;i.height=row.height;i.loading='lazy';i.alt=c.textContent;a.append(i);f.append(c,a);return f}
function render(){const t=text[lang];document.documentElement.lang=lang;$('title').textContent=t[0];$('tempo').textContent=t[1];$('reader').textContent=t[2];$('reader').href='/storyboard/review/bath-magic-r23.html?lang='+lang+'#scene-331';$('status').textContent=t[3]+': '+manifest.selectedFrames+'/15. '+t[manifest.selectedFrames===15?5:4];$('sheets').replaceChildren();const rows=manifest.sheets.filter(r=>r.lang===lang);rows.filter(r=>r.kind==='five-frame').forEach(r=>$('sheets').append(figure(r)));for(const[k,label]of[['fifteen-frame',t[6]],['transitions',t[7]]]){const row=rows.find(r=>r.kind===k);if(row){const d=document.createElement('details'),s=document.createElement('summary');s.textContent=label;d.append(s,figure(row));$('sheets').append(d)}}}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});fetch('manifest.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{manifest=d;render()}).catch(e=>{$('status').textContent=e.message});
</script></html>
