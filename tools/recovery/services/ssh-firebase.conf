# Add this alias to the Air's existing ~/.ssh/config; retain the other aliases.
# The host-key alias must match the already trusted VPS host identity.
Host hostinger-vps-firebase
  HostName 127.0.0.1
  Port 22222
  User root
  HostKeyAlias 100.109.138.51
  StrictHostKeyChecking yes
  ConnectTimeout 20
  ServerAliveInterval 20
  ServerAliveCountMax 3
