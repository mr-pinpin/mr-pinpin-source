[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "replica-store"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["huggingface-hub>=1.27,<2"]
[project.scripts]
replica-store = "replica_store.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
